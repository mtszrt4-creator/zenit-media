<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copertine evidenze</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --testo: #f2f2f2; --tenue: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--testo);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--tenue); font-size: 14px; line-height: 1.5; margin: 0 0 24px; max-width: 34em; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 24px;
       grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 1100px; }
  figure { margin: 0; }
  img { width: 100%; aspect-ratio: 1; border-radius: 16px; display: block; }
  figcaption { margin-top: 8px; font-size: 14px; }
  figcaption span { color: var(--tenue); }
</style>
</head>
<body>
  <h1>Copertine delle evidenze</h1>
  <p>Tieni premuto su un'immagine e salvala nella galleria. Poi: profilo &rarr; evidenza &rarr;
     Modifica &rarr; Modifica copertina &rarr; galleria.</p>
  <ul>
    <li><figure><img src="cose.png" alt="Bolla di chat con tre puntini">
      <figcaption>Cos'&egrave; <span>&middot; cose.png</span></figcaption></figure></li>
    <li><figure><img src="come.png" alt="Calendario con spunta">
      <figcaption>Come funziona <span>&middot; come.png</span></figcaption></figure></li>
    <li><figure><img src="chi.png" alt="Marchio ZenitPT">
      <figcaption>Chi siamo <span>&middot; chi.png</span></figcaption></figure></li>
    <li><figure><img src="dom.png" alt="Punto interrogativo">
      <figcaption>Domande <span>&middot; dom.png</span></figcaption></figure></li>
  </ul>
</body>
</html>
